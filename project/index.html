<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7f2" />
    <meta
      name="description"
      content="A quiet placeholder for a project in progress."
    />
    <title>Coming soon</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f8f7f2;
        color: #282723;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 32px;
      }

      h1 {
        margin: -0.08em 0 0;
        color: #282723;
        font-family: Iowan Old Style, "Palatino Linotype", "Book Antiqua",
          Georgia, serif;
        font-size: clamp(3.5rem, 8vw, 6rem);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 1.08;
        text-align: center;
        text-wrap: balance;
      }

      @media (max-width: 480px) {
        main {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>coming soon</h1>
    </main>
  </body>
</html>
